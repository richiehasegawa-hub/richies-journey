<svg viewBox="0 0 1100 760" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Arial',sans-serif">
  <rect width="1100" height="760" fill="#F7F8FA"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1A202C">コルチナ・ダンペッツォ周辺　EP分布マップ</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#718096">EP11〜EP20　ドロミテ山岳エリア（6月29日〜7月4日）</text>

  <!-- Sky background -->
  <rect x="80" y="85" width="940" height="610" rx="8" fill="#EBF8FF" opacity="0.7"/>

  <!-- Mountain silhouettes (decorative, background) -->
  <!-- Tofane group (NW of Cortina) -->
  <polygon points="140,430 200,310 260,430" fill="#A0AEC0" opacity="0.3"/>
  <polygon points="200,430 280,270 350,430" fill="#A0AEC0" opacity="0.3"/>
  <!-- Cristallo (NE) -->
  <polygon points="650,430 720,290 780,430" fill="#A0AEC0" opacity="0.3"/>
  <!-- Tre Cime area (east) -->
  <polygon points="780,430 830,340 860,340 900,430" fill="#A0AEC0" opacity="0.25"/>
  <!-- Cinque Torri (SW) -->
  <polygon points="300,500 340,420 360,430 380,415 400,420 420,500" fill="#A0AEC0" opacity="0.3"/>

  <!-- Roads -->
  <!-- SS48 main road (E-W through Cortina) -->
  <path d="M100 480 Q300 460 500 455 Q650 452 900 460" stroke="#E2E8F0" stroke-width="4" fill="none"/>
  <path d="M100 480 Q300 460 500 455 Q650 452 900 460" stroke="#718096" stroke-width="2" fill="none" stroke-dasharray="8,3"/>
  <text x="500" y="445" text-anchor="middle" font-size="10" fill="#718096">SS48（コルチナ〜ミズリーナ方面）</text>

  <!-- Road to Tre Cime -->
  <path d="M780 460 Q820 420 860 390 Q890 370 920 370" stroke="#A0AEC0" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <!-- Road to Cinque Torri -->
  <path d="M430 460 Q390 450 360 440 Q340 430 320 450" stroke="#A0AEC0" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <!-- Road from Venice (EP11) -->
  <path d="M100 540 Q200 510 320 490 Q420 475 500 470" stroke="#B7791F" stroke-width="2" fill="none" stroke-dasharray="6,3"/>
  <text x="240" y="530" font-size="10" fill="#B7791F">ベネチアから（コルチナ・エクスプレス）</text>

  <!-- === EP SPOTS === -->

  <!-- EP11: Venice → Cortina arrival, center Cortina -->
  <circle cx="500" cy="455" r="22" fill="#2B6CB0" opacity="0.95" stroke="white" stroke-width="2"/>
  <text x="500" y="451" text-anchor="middle" font-size="12" font-weight="bold" fill="white">11</text>
  <text x="500" y="465" text-anchor="middle" font-size="8" fill="#BEE3F8">到着</text>

  <!-- Cortina town label -->
  <rect x="445" y="478" width="110" height="22" rx="4" fill="white" stroke="#2B6CB0" stroke-width="1.5" opacity="0.95"/>
  <text x="500" y="494" text-anchor="middle" font-size="11" font-weight="bold" fill="#2B6CB0">コルチナ・ダンペッツォ</text>

  <!-- EP12: Faloria lookout (E of Cortina, cable car up) -->
  <circle cx="590" cy="360" r="16" fill="#2B6CB0" opacity="0.9"/>
  <text x="590" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="white">12</text>
  <rect x="608" y="348" width="125" height="28" rx="4" fill="white" stroke="#2B6CB0" stroke-width="1" opacity="0.95"/>
  <text x="670" y="367" text-anchor="middle" font-size="10" fill="#2B6CB0">ファローリア展望台</text>
  <!-- Cable car line -->
  <line x1="520" y1="455" x2="590" y2="360" stroke="#2B6CB0" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>
  <text x="548" y="400" font-size="9" fill="#2B6CB0" transform="rotate(-55,548,400)">ロープウェー</text>

  <!-- EP13: e-bike touring around Cortina valley -->
  <circle cx="420" cy="420" r="16" fill="#B7791F" opacity="0.9"/>
  <text x="420" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="white">13</text>
  <rect x="270" y="408" width="130" height="28" rx="4" fill="white" stroke="#B7791F" stroke-width="1" opacity="0.95"/>
  <text x="335" y="427" text-anchor="middle" font-size="10" fill="#B7791F">e-bikeツーリング</text>
  <!-- Circular route around valley -->
  <ellipse cx="500" cy="460" rx="160" ry="80" fill="none" stroke="#B7791F" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>

  <!-- EP14/15: Tre Cime di Lavaredo (far east) -->
  <circle cx="870" cy="350" r="20" fill="#276749" opacity="0.95" stroke="white" stroke-width="2"/>
  <text x="870" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="white">14</text>
  <text x="870" y="358" text-anchor="middle" font-size="8" fill="#C6F6D5">15</text>
  <rect x="748" y="310" width="110" height="42" rx="4" fill="white" stroke="#276749" stroke-width="1.5" opacity="0.95"/>
  <text x="803" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#276749">トレ・チーメ</text>
  <text x="803" y="344" text-anchor="middle" font-size="9" fill="#276749">di Lavaredo</text>
  <!-- Distance marker -->
  <text x="750" y="395" font-size="10" fill="#276749" opacity="0.8">コルチナから約25km</text>

  <!-- EP16/17: Cinque Torri (SW of Cortina) -->
  <circle cx="330" cy="420" r="20" fill="#276749" opacity="0.95" stroke="white" stroke-width="2"/>
  <text x="330" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="white">16</text>
  <text x="330" y="428" text-anchor="middle" font-size="8" fill="#C6F6D5">17</text>
  <rect x="195" y="380" width="115" height="42" rx="4" fill="white" stroke="#276749" stroke-width="1.5" opacity="0.95"/>
  <text x="252" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#276749">チンクエ・トッリ</text>
  <text x="252" y="412" text-anchor="middle" font-size="9" fill="#276749">WWI要塞跡ハイク</text>

  <!-- EP18: Lago di Misurina (NE of Cortina) -->
  <!-- Lake shape -->
  <ellipse cx="730" cy="420" rx="40" ry="25" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1.5" opacity="0.8"/>
  <circle cx="730" cy="420" r="18" fill="#2B6CB0" opacity="0.85"/>
  <text x="730" y="415" text-anchor="middle" font-size="10" font-weight="bold" fill="white">18</text>
  <text x="730" y="427" text-anchor="middle" font-size="7" fill="#BEE3F8">湖</text>
  <rect x="762" y="408" width="115" height="28" rx="4" fill="white" stroke="#2B6CB0" stroke-width="1" opacity="0.95"/>
  <text x="819" y="427" text-anchor="middle" font-size="10" fill="#2B6CB0">ミズリーナ湖の静寂</text>

  <!-- EP19: Mountain resort stay (Cortina hotels area) -->
  <circle cx="480" cy="500" r="16" fill="#6B46C1" opacity="0.9"/>
  <text x="480" y="505" text-anchor="middle" font-size="11" font-weight="bold" fill="white">19</text>
  <rect x="330" y="487" width="130" height="28" rx="4" fill="white" stroke="#6B46C1" stroke-width="1" opacity="0.95"/>
  <text x="395" y="506" text-anchor="middle" font-size="10" fill="#6B46C1">山岳リゾートステイ</text>

  <!-- EP20: Departure (Venice direction) -->
  <circle cx="140" cy="540" r="16" fill="#4A5568" opacity="0.9"/>
  <text x="140" y="545" text-anchor="middle" font-size="11" font-weight="bold" fill="white">20</text>
  <rect x="158" y="528" width="130" height="28" rx="4" fill="white" stroke="#4A5568" stroke-width="1" opacity="0.95"/>
  <text x="223" y="547" text-anchor="middle" font-size="10" fill="#4A5568">総集編・帰路へ</text>

  <!-- Mountain peak labels -->
  <text x="210" y="300" text-anchor="middle" font-size="10" fill="#4A5568" opacity="0.7">トファーニ山群</text>
  <text x="720" y="280" text-anchor="middle" font-size="10" fill="#4A5568" opacity="0.7">クリスタッロ山</text>
  <text x="840" y="330" text-anchor="middle" font-size="10" fill="#4A5568" opacity="0.7">トレ・チーメ</text>
  <text x="355" y="410" text-anchor="middle" font-size="10" fill="#4A5568" opacity="0.7">チンクエ・トッリ</text>

  <!-- Altitude labels -->
  <text x="500" y="130" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">ドロミテ山群　世界自然遺産（2009年）</text>

  <!-- Compass -->
  <circle cx="1030" cy="130" r="24" fill="white" stroke="#CBD5E0" stroke-width="1.5"/>
  <text x="1030" y="118" text-anchor="middle" font-size="14" fill="#4A5568">N</text>
  <line x1="1030" y1="123" x2="1030" y2="147" stroke="#E53E3E" stroke-width="2"/>
  <polygon points="1030,108 1026,122 1034,122" fill="#E53E3E"/>

  <!-- Scale bar -->
  <line x1="880" y1="660" x2="980" y2="660" stroke="#4A5568" stroke-width="2"/>
  <line x1="880" y1="655" x2="880" y2="665" stroke="#4A5568" stroke-width="2"/>
  <line x1="980" y1="655" x2="980" y2="665" stroke="#4A5568" stroke-width="2"/>
  <text x="930" y="675" text-anchor="middle" font-size="10" fill="#4A5568">約10km</text>

  <!-- Legend / Summary -->
  <rect x="80" y="695" width="940" height="55" rx="8" fill="#EDF2F7" stroke="#CBD5E0" stroke-width="1"/>
  <circle cx="110" cy="716" r="7" fill="#2B6CB0"/>
  <text x="124" y="720" font-size="11" fill="#2B6CB0">移動・到着・ロープウェー</text>
  <circle cx="300" cy="716" r="7" fill="#276749"/>
  <text x="314" y="720" font-size="11" fill="#276749">ハイキング（トレ・チーメ／チンクエ・トッリ）</text>
  <circle cx="570" cy="716" r="7" fill="#B7791F"/>
  <text x="584" y="720" font-size="11" fill="#B7791F">e-bikeツーリング</text>
  <circle cx="700" cy="716" r="7" fill="#6B46C1"/>
  <text x="714" y="720" font-size="11" fill="#6B46C1">リゾートステイ</text>
  <text x="110" y="738" font-size="11" fill="#718096">コルチナ滞在：Hotel Aquila（6/29〜7/4、5泊）　標高1224m　ヴェネト州</text>
</svg>
